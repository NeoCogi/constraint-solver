# Validate every distributable and developer-facing target on pushes and pull
# requests. Benchmark execution remains manual; CI compiles its harness instead.
name: CI

on:
  push:
  pull_request:

# The workflow only reads repository contents and does not publish artifacts or
# mutate pull requests.
permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit RustSec advisories
    runs-on: ubuntu-latest
    permissions:
      # The RustSec action reads the lockfile and publishes a dedicated check;
      # it receives no issue, pull-request, package, or repository-write access.
      contents: read
      checks: write

    steps:
      # Audit the exact locked transitive graph belonging to this revision.
      - name: Check out repository
        uses: actions/checkout@v4

      # RustSec's maintained action installs cargo-audit, refreshes the advisory
      # database, and fails this job when the lockfile contains a vulnerability.
      - name: Check dependency advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: Minimum supported Rust 1.86
    runs-on: ubuntu-latest

    steps:
      # Check out the same locked dependency graph consumed by the release
      # validation job below.
      - name: Check out repository
        uses: actions/checkout@v4

      # Pin this job to the manifest's declared minimum so an accidental use of
      # a newer language or standard-library feature fails independently of the
      # moving stable toolchain.
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86

      # Cache entries are keyed by toolchain, so MSRV artifacts cannot mask or
      # overwrite results produced by the stable validation job.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Compile and run every ordinary target against the locked dependency
      # versions. The Criterion executable remains excluded by its required
      # opt-in feature, matching the stable correctness suite.
      - name: Test all targets at the MSRV
        run: cargo test --locked --all-targets

  portable-library:
    name: Check library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every supported host result even if one platform fails first.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # Use the exact source revision and dependency lockfile validated on Linux.
      - name: Check out repository
        uses: actions/checkout@v4

      # Portability tracks the current stable toolchain; the separate Linux job
      # above owns the lower-bound compiler contract.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Toolchain and target metadata keep artifacts isolated across the two
      # operating-system matrix entries.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Check only the distributable library. GUI development dependencies and
      # the X11-based interactive example are validated in the Linux all-target
      # job and are not part of the crate's portable runtime surface.
      - name: Check locked library
        run: cargo check --locked --lib

  validate:
    name: Format, lint, test, and package
    runs-on: ubuntu-latest

    steps:
      # Check out the exact revision whose source and manifest are being tested.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install the stable compiler plus the two components used as hard gates.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Reuse registry and target artifacts without treating cache availability
      # as part of build correctness.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # Compile every feature and target, including examples and the opt-in
      # Criterion harness, while promoting all warnings to failures.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The benchmark feature is intentionally absent so Criterion is not
      # executed as part of the correctness suite.
      - name: Run unit and example tests
        run: cargo test --all-targets

      # `cargo test --all-targets` builds example harnesses but does not execute
      # their `main` functions. Run every headless example so solver failures and
      # their self-checking numerical assertions participate in the release
      # gate; the interactive GLFW program cannot run on a headless CI worker.
      - name: Run headless examples
        run: |
          cargo run --locked --example cad_circle_intersection
          cargo run --locked --example cad_segment_horizontal
          cargo run --locked --example circuit_diode
          cargo run --locked --example circuit_voltage_divider

      - name: Run documentation tests
        run: cargo test --doc

      - name: Compile benchmark harness
        run: cargo check --bench linear_algebra --features benchmarks

      # Package verification catches missing files and manifest metadata errors
      # using the same locked dependency graph as the preceding checks.
      - name: Verify crate package
        run: cargo package --locked
