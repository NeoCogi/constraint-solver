[package]
name = "constraint-solver"
version = "0.1.0"
edition = "2024"
description = "A small, generic nonlinear constraint solver with symbolic expressions, compilation, and a modified Newton-Raphson method."
license = "MIT"
readme = "README.md"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
keywords = [
    "constraints",
    "solver",
    "nonlinear",
    "least-squares",
    "optimization",
]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
rayon = "1.8"

[dev-dependencies]
criterion = "0.5"
glow = "0.13"
glfw = "0.55"
rs-math3d = "0.9.24"

[[bench]]
name = "linear_algebra"
harness = false
