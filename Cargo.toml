[package]
name = "constraint-solver"
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
description = "An f64 nonlinear constraint solver with symbolic expressions, compilation, and damped Newton iteration."
license = "MIT"
repository = "https://github.com/NeoCogi/constraint-solver"
readme = "README.md"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
keywords = [
    "constraints",
    "solver",
    "nonlinear",
    "least-squares",
    "optimization",
]
categories = ["mathematics", "science", "algorithms"]

[features]
# Keep the harnessless Criterion executable out of ordinary all-target test
# runs; performance measurement is an explicit developer operation.
benchmarks = []

[dependencies]
rayon = "1.8"

[dev-dependencies]
criterion = "0.8"
glow = "0.16"
# The IK example needs window/context creation only. Disabling GLFW's `all`
# default avoids unrelated image, Vulkan, logging, and dual-backend dependency
# trees; prebuilt native libraries retain portable example compilation.
glfw = { version = "0.61", default-features = false, features = ["prebuilt-libs", "raw-window-handle-v0-6", "x11"] }
rs-math3d = "0.10"

[[bench]]
name = "linear_algebra"
harness = false
required-features = ["benchmarks"]
