[package]
name = "constraint-solver"
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
description = "An f64 nonlinear constraint solver with symbolic expressions, compilation, and Armijo-globalized Newton iteration."
license = "MIT"
repository = "https://github.com/NeoCogi/constraint-solver"
readme = "README.md"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
keywords = [
    "constraints",
    "solver",
    "nonlinear",
    "least-squares",
    "optimization",
]
categories = ["mathematics", "science", "algorithms"]
# Keep repository automation and local tooling out of the crate archive. New
# publishable assets must be added deliberately rather than leaking through a
# growing VCS checkout by default.
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "benches/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[features]
# Keep the harnessless Criterion executable out of ordinary all-target test
# runs; performance measurement is an explicit developer operation.
benchmarks = []
# Keep native window-system dependencies out of ordinary builds and tests. The
# interactive example opts into them explicitly.
glfw-example = ["dep:glfw", "dep:glow", "dep:rs-math3d"]

[dependencies]
# The IK example needs window/context creation only. Disabling GLFW's `all`
# default avoids unrelated image, Vulkan, logging, and dual-backend dependency
# trees. Optional dependencies ensure ordinary crate consumers and test runs do
# not build native window-system code.
glfw = { version = "0.61", optional = true, default-features = false, features = ["prebuilt-libs", "raw-window-handle-v0-6", "x11"] }
glow = { version = "0.16", optional = true }
rs-math3d = { version = "0.10", optional = true }

[dev-dependencies]
criterion = "0.8"

[[example]]
name = "ik_2d_glfw"
required-features = ["glfw-example"]

[[bench]]
name = "linear_algebra"
harness = false
required-features = ["benchmarks"]
