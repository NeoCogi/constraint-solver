[package]
name = "constraint-solver"
version = "0.1.1"
edition = "2024"
description = "A small, generic nonlinear constraint solver with symbolic expressions, compilation, and a modified Newton-Raphson method."
license = "MIT"
repository = "https://github.com/NeoCogi/constraint-solver"
readme = "README.md"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
keywords = [
    "constraints",
    "solver",
    "nonlinear",
    "least-squares",
    "optimization",
]
categories = ["mathematics", "science", "algorithms"]

[features]
# Keep the harnessless Criterion executable out of ordinary all-target test
# runs; performance measurement is an explicit developer operation.
benchmarks = []

[dependencies]
rayon = "1.8"

[dev-dependencies]
criterion = "0.8"
glow = "0.16"
glfw = "0.61"
rs-math3d = "0.10"

[[bench]]
name = "linear_algebra"
harness = false
required-features = ["benchmarks"]
